<!DOCTYPE html>
<html>
<head>
    <title>Symbols for Legacy Computing</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: white;
            margin: 20px;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 40px;
            page-break-after: always;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: normal;
        }
        .header-row {
            display: grid;
            gap: 1px;
            margin-bottom: 1px;
            font-size: 9px;
        }
        .header-cell {
            text-align: center;
            font-weight: bold;
            padding: 2px 0;
        }
        .grid {
            width: fit-content;
            display: grid;
            gap: 0;
            border: 1px solid #000;
        }
        .row-header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            background: white;
            border-right: 1px solid #000;
        }
        .cell {
            border: none;
            border-bottom: 1px solid #000;
            border-left: 1px solid #000;
            text-align: center;
            padding: 2px;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .cell.empty {
            background: white;
        }
        /* Remove bottom border from last row of cells */
        .grid > .cell:nth-last-child(-n+16) {
            border-bottom: none;
        }
        /* Remove left border from first cell in each row */
        .grid > .cell:nth-child(17n+2) {
            border-left: none;
        }
        .glyph {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glyph img {
            width: 28px;
            height: 28px;
        }
        .code {
            font-size: 7px;
            color: #000;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="section">
        <h2>1FB00 - 1FBFF    Symbols for Legacy Computing    1FB00 - 1FBFF</h2>
        <div class="header-row" style="grid-template-columns: 50px repeat(16, 50px);">
            <div class="header-cell"></div>
            <div class="header-cell">0</div>
            <div class="header-cell">1</div>
            <div class="header-cell">2</div>
            <div class="header-cell">3</div>
            <div class="header-cell">4</div>
            <div class="header-cell">5</div>
            <div class="header-cell">6</div>
            <div class="header-cell">7</div>
            <div class="header-cell">8</div>
            <div class="header-cell">9</div>
            <div class="header-cell">A</div>
            <div class="header-cell">B</div>
            <div class="header-cell">C</div>
            <div class="header-cell">D</div>
            <div class="header-cell">E</div>
            <div class="header-cell">F</div>
        </div>
        <div class="grid" id="grid0" style="grid-template-columns: 50px repeat(16, 50px);"></div>
    </div>

    <script>
        const sections = [
            { id: 0, startRow: 0x1FB0, endRow: 0x1FBF, rangeStart: 0x1FB00, rangeEnd: 0x1FBFF },
        ];

        sections.forEach(section => {
            const grid = document.getElementById('grid' + section.id);

            // Rows are now hex prefixes, columns are offsets 0-F
            for (let row = section.startRow; row <= section.endRow; row++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'row-header';
                rowHeader.textContent = row.toString(16).toUpperCase();
                grid.appendChild(rowHeader);

                for (let col = 0; col < 16; col++) {
                    const codepoint = (row << 4) | col;
                    const hex = codepoint.toString(16).toUpperCase();

                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    if (codepoint < section.rangeStart || codepoint > section.rangeEnd) {
                        cell.classList.add('empty');
                        cell.innerHTML = `<div class="glyph"></div><div class="code">${hex}</div>`;
                    } else {
                        cell.innerHTML = `
                            <div class="glyph">
                                <img src="U+${hex}.svg" alt="U+${hex}" onerror="this.parentElement.innerHTML='?'">
                            </div>
                            <div class="code">${hex}</div>
                        `;
                    }

                    grid.appendChild(cell);
                }
            }
        });
    </script>
</body>
</html>
