<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>circle</title>
<style>
  :root {
    --bg:  #1d2021;
    --fg:  #d4be98;
    --cell: 32px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    padding: 2rem;
    font-family: monospace;
    line-height: 1.5;
  }
  a { color: #7daea3; }
  p { margin-bottom: 1rem; }
  .grid {
    display: block;
    line-height: 0;
    margin: 1rem 0;
  }
  .row {
    display: flex;
  }
  .cell {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px #3c3836;
  }
  .cell:hover::after, .cell.active::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid #7daea3;
    pointer-events: none;
    z-index: 1;
  }
  .cell.glyph svg {
    width: var(--cell);
    height: var(--cell);
    display: block;
    fill: var(--fg);
  }
  .cell.filled {
    background: var(--fg);
  }
  .cell.half-left {
    background: linear-gradient(to right, var(--fg) 50%, transparent 50%);
  }
  .cell.unknown {
    background: #3a2a1a;
  }
  #popover {
    position: fixed;
    background: #282828;
    color: #d4be98;
    border: 1px solid #7daea3;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 0.75rem;
    pointer-events: none;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>
When combined with
<a href="https://www.compart.com/en/unicode/U+2B24">Large Black Circle ⬤</a>, a
circle can inhabit one of nine positions in a 2x2 grid. Potentially useful for
games.

<div id="popover"></div>
<script>
  const popover = document.getElementById('popover');
  let pinned = null;

  function showAt(cell, x, y) {
    popover.textContent = cell.dataset.cp;
    popover.style.display = 'block';
    place(x, y);
  }

  function place(x, y) {
    const pad = 8;
    popover.style.left = '0';
    popover.style.top = '0';
    const pw = popover.offsetWidth, ph = popover.offsetHeight;
    let left = x + pad;
    let top = y - ph - pad;
    if (left + pw > window.innerWidth) left = x - pw - pad;
    if (top < 0) top = y + pad;
    popover.style.left = left + 'px';
    popover.style.top = top + 'px';
  }

  function hide() {
    popover.style.display = 'none';
    if (pinned) { pinned.classList.remove('active'); pinned = null; }
  }

  document.querySelectorAll('.cell[data-cp]').forEach(cell => {
    cell.addEventListener('mouseenter', e => {
      if (!pinned) showAt(cell, e.clientX, e.clientY);
    });
    cell.addEventListener('mousemove', e => {
      if (!pinned) place(e.clientX, e.clientY);
    });
    cell.addEventListener('mouseleave', () => {
      if (!pinned) hide();
    });
    cell.addEventListener('click', e => {
      e.stopPropagation();
      if (pinned === cell) {
        hide();
      } else {
        if (pinned) pinned.classList.remove('active');
        pinned = cell;
        pinned.classList.add('active');
        showAt(cell, e.clientX, e.clientY);
      }
    });
  });

  document.addEventListener('click', hide);
</script>
</body>
